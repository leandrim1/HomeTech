<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Ilustração de bancada de assistência técnica com smartphone aberto, placa e ferramentas de precisão">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#17181C"/>
      <stop offset="0.5" stop-color="#0B0C0E"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="key" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#D7AE55" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#D7AE55" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#D7AE55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.18" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#C5C8CC" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C5C8CC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#9BA0A6"/>
      <stop offset="0.35" stop-color="#E4E7EA"/>
      <stop offset="0.62" stop-color="#8C9197"/>
      <stop offset="1" stop-color="#5A5F65"/>
    </linearGradient>
    <linearGradient id="steelSoft" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3A3D42"/>
      <stop offset="0.5" stop-color="#23262A"/>
      <stop offset="1" stop-color="#15171A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8E6B24"/>
      <stop offset="0.32" stop-color="#F1D58A"/>
      <stop offset="0.6" stop-color="#D7AE55"/>
      <stop offset="1" stop-color="#8E6B24"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1D2026"/>
      <stop offset="0.5" stop-color="#0D0F12"/>
      <stop offset="1" stop-color="#070809"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7AE55" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D7AE55" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#C5C8CC" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="vign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050505" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#050505" stop-opacity="0"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/>
  <rect width="800" height="560" fill="url(#grid)"/>
  <rect width="800" height="560" fill="url(#rim)"/>
  <rect width="800" height="560" fill="url(#key)"/>

  <g>
    <rect x="0" y="452" width="800" height="2" fill="url(#fade)" opacity="0.5"/>
    <rect x="0" y="454" width="800" height="106" fill="#070708"/>
    <ellipse cx="400" cy="456" rx="300" ry="26" fill="#D7AE55" opacity="0.07"/>
  </g>
  <g stroke="#D7AE55" stroke-opacity="0.3" fill="none" stroke-width="1.4" transform="translate(26 96) scale(1 1)">
    <path d="M0 0h46l18 18h52"/>
    <path d="M0 26h30l16-16h40"/>
    <path d="M0 52h58l14 14h38"/>
    <circle cx="116" cy="18" r="3" fill="#D7AE55" stroke="none"/>
    <circle cx="86" cy="10" r="3" fill="#D7AE55" stroke="none"/>
    <circle cx="124" cy="66" r="3" fill="#D7AE55" stroke="none"/>
  </g>
  <g stroke="#D7AE55" stroke-opacity="0.3" fill="none" stroke-width="1.4" transform="translate(774 326) scale(-1 1)">
    <path d="M0 0h46l18 18h52"/>
    <path d="M0 26h30l16-16h40"/>
    <path d="M0 52h58l14 14h38"/>
    <circle cx="116" cy="18" r="3" fill="#D7AE55" stroke="none"/>
    <circle cx="86" cy="10" r="3" fill="#D7AE55" stroke="none"/>
    <circle cx="124" cy="66" r="3" fill="#D7AE55" stroke="none"/>
  </g>

  <!-- display assembly lifted off the chassis -->
  <g transform="translate(486 92) rotate(7)">
    <rect x="0" y="0" width="162" height="288" rx="26" fill="#0E1013" stroke="url(#gold)" stroke-width="2.4"/>
    <rect x="11" y="11" width="140" height="266" rx="18" fill="url(#screen)"/>
    <rect x="11" y="11" width="140" height="266" rx="18" fill="#C5C8CC" opacity="0.07"/>
    <rect x="57" y="24" width="48" height="6" rx="3" fill="#D7AE55" opacity="0.6"/>
    <!-- ribbon cable back to the chassis -->
    <path d="M6 212c-26 10-44 6-62-6" fill="none" stroke="#D7AE55" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
    <path d="M6 212c-26 10-44 6-62-6" fill="none" stroke="#050505" stroke-opacity="0.5" stroke-width="1.6" stroke-dasharray="3 5"/>
  </g>

  <!-- chassis open on the bench, board exposed -->
  <g transform="translate(284 120)">
    <rect x="0" y="0" width="176" height="302" rx="26" fill="url(#steelSoft)" stroke="url(#steel)" stroke-width="2.5"/>
    <rect x="12" y="12" width="152" height="278" rx="18" fill="#090A0C"/>
    <!-- logic board -->
    <rect x="24" y="26" width="128" height="94" rx="7" fill="#12161A" stroke="#D7AE55" stroke-opacity="0.45"/>
    <rect x="36" y="40" width="34" height="26" rx="4" fill="#D7AE55" opacity="0.55"/>
    <rect x="80" y="40" width="58" height="11" rx="2" fill="#C5C8CC" opacity="0.28"/>
    <rect x="80" y="58" width="40" height="8" rx="2" fill="#C5C8CC" opacity="0.18"/>
    <path d="M36 80h102M36 94h74M36 106h92" stroke="#C5C8CC" stroke-opacity="0.16" stroke-width="2"/>
    <!-- battery cell -->
    <rect x="24" y="134" width="128" height="104" rx="9" fill="#0E1114" stroke="#C5C8CC" stroke-opacity="0.2"/>
    <path d="M60 150l-14 34h22l-12 34" fill="none" stroke="#D7AE55" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="92" y="156" width="44" height="7" rx="3.5" fill="#C5C8CC" opacity="0.25"/>
    <rect x="92" y="172" width="32" height="7" rx="3.5" fill="#C5C8CC" opacity="0.15"/>
    <!-- speaker / taptic module -->
    <rect x="24" y="250" width="128" height="30" rx="7" fill="#101316" stroke="#C5C8CC" stroke-opacity="0.16"/>
    <g fill="#C5C8CC" opacity="0.22">
      <circle cx="44" cy="265" r="3"/><circle cx="58" cy="265" r="3"/><circle cx="72" cy="265" r="3"/><circle cx="86" cy="265" r="3"/>
    </g>
    <circle cx="130" cy="265" r="8" fill="none" stroke="#D7AE55" stroke-opacity="0.5" stroke-width="2"/>
    <!-- corner screw seats -->
    <g fill="none" stroke="#D7AE55" stroke-opacity="0.45" stroke-width="1.6">
      <circle cx="28" cy="18" r="4"/><circle cx="148" cy="18" r="4"/>
      <circle cx="28" cy="284" r="4"/><circle cx="148" cy="284" r="4"/>
    </g>
  </g>

  <!-- precision screwdriver -->
  <g transform="translate(676 262) rotate(24)">
    <rect x="0" y="0" width="22" height="116" rx="9" fill="url(#steelSoft)" stroke="#C5C8CC" stroke-opacity="0.3"/>
    <rect x="4" y="12" width="14" height="86" rx="7" fill="#D7AE55" opacity="0.28"/>
    <rect x="7" y="114" width="8" height="70" rx="3" fill="url(#steel)"/>
    <rect x="8.5" y="182" width="5" height="15" rx="1.6" fill="#D7AE55"/>
  </g>
  <!-- tweezers -->
  <g transform="translate(168 226) rotate(-22)" fill="none" stroke="url(#steel)" stroke-width="5" stroke-linecap="round">
    <path d="M14 0c-6 56-10 98-13 134"/>
    <path d="M26 0c4 56 8 98 11 134"/>
    <path d="M14 0h12" stroke-width="7"/>
  </g>
  <!-- loose screws on the bench -->
  <g fill="#C5C8CC" opacity="0.5">
    <circle cx="226" cy="426" r="5"/><circle cx="248" cy="438" r="3.6"/><circle cx="204" cy="440" r="3.2"/>
    <circle cx="648" cy="432" r="4.4"/><circle cx="672" cy="442" r="3"/>
  </g>
  <rect width="800" height="560" fill="url(#vign)"/>
</svg>
