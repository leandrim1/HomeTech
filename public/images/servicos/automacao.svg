<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Ilustração de casa com iluminação inteligente conectada a dispositivos e controle pelo celular">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#17181C"/>
      <stop offset="0.5" stop-color="#0B0C0E"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="key" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#D7AE55" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#D7AE55" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#D7AE55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.18" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#C5C8CC" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C5C8CC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#9BA0A6"/>
      <stop offset="0.35" stop-color="#E4E7EA"/>
      <stop offset="0.62" stop-color="#8C9197"/>
      <stop offset="1" stop-color="#5A5F65"/>
    </linearGradient>
    <linearGradient id="steelSoft" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3A3D42"/>
      <stop offset="0.5" stop-color="#23262A"/>
      <stop offset="1" stop-color="#15171A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8E6B24"/>
      <stop offset="0.32" stop-color="#F1D58A"/>
      <stop offset="0.6" stop-color="#D7AE55"/>
      <stop offset="1" stop-color="#8E6B24"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1D2026"/>
      <stop offset="0.5" stop-color="#0D0F12"/>
      <stop offset="1" stop-color="#070809"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7AE55" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D7AE55" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#C5C8CC" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="vign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050505" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#050505" stop-opacity="0"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/>
  <rect width="800" height="560" fill="url(#grid)"/>
  <rect width="800" height="560" fill="url(#rim)"/>
  <rect width="800" height="560" fill="url(#key)"/>

  <g>
    <rect x="0" y="470" width="800" height="2" fill="url(#fade)" opacity="0.5"/>
    <rect x="0" y="472" width="800" height="88" fill="#070708"/>
    <ellipse cx="400" cy="474" rx="300" ry="26" fill="#D7AE55" opacity="0.07"/>
  </g>

  <!-- modern house volume -->
  <g transform="translate(118 112)">
    <path d="M0 108L218 0l218 108v258H0z" fill="url(#steelSoft)" stroke="url(#steel)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M0 108L218 0v366H0z" fill="#000" opacity="0.26"/>
    <!-- lit windows -->
    <g>
      <rect x="40" y="168" width="104" height="80" rx="7" fill="#D7AE55" opacity="0.22" stroke="#D7AE55" stroke-opacity="0.55" stroke-width="1.6"/>
      <rect x="166" y="168" width="104" height="80" rx="7" fill="#F1D58A" opacity="0.3" stroke="#D7AE55" stroke-opacity="0.65" stroke-width="1.6"/>
      <rect x="292" y="168" width="104" height="80" rx="7" fill="#C5C8CC" opacity="0.09" stroke="#C5C8CC" stroke-opacity="0.2" stroke-width="1.6"/>
      <rect x="40" y="276" width="104" height="60" rx="7" fill="#C5C8CC" opacity="0.08" stroke="#C5C8CC" stroke-opacity="0.18" stroke-width="1.6"/>
      <rect x="166" y="276" width="104" height="90" rx="7" fill="#D7AE55" opacity="0.16" stroke="#D7AE55" stroke-opacity="0.45" stroke-width="1.6"/>
      <rect x="292" y="276" width="104" height="60" rx="7" fill="#C5C8CC" opacity="0.08" stroke="#C5C8CC" stroke-opacity="0.18" stroke-width="1.6"/>
    </g>
    <!-- warm spill from the lit rooms -->
    <path d="M166 248h104l34 54H132z" fill="#D7AE55" opacity="0.07"/>
  </g>
  <!-- connection mesh -->
  <g stroke="#D7AE55" stroke-opacity="0.35" stroke-width="1.5" fill="none" stroke-dasharray="5 7">
    <path d="M620 118L470 206M620 118L648 268M648 268L470 206M648 268L596 396M596 396L470 206"/>
  </g>
  <!-- node: smart bulb -->
  <g transform="translate(588 76)">
    <circle cx="32" cy="32" r="30" fill="#0C0D0F" stroke="url(#gold)" stroke-width="2.2"/>
    <path d="M32 14a13 13 0 00-8 23v5h16v-5a13 13 0 00-8-23z" fill="#D7AE55" opacity="0.75"/>
    <path d="M25 46h14M27 51h10" stroke="#C5C8CC" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- node: speaker / hub -->
  <g transform="translate(616 226)">
    <circle cx="32" cy="32" r="30" fill="#0C0D0F" stroke="#C5C8CC" stroke-opacity="0.4" stroke-width="2.2"/>
    <rect x="21" y="16" width="22" height="32" rx="11" fill="url(#steelSoft)" stroke="#C5C8CC" stroke-opacity="0.3"/>
    <circle cx="32" cy="42" r="3.5" fill="#D7AE55"/>
    <path d="M32 50v4" stroke="#C5C8CC" stroke-opacity="0.4" stroke-width="2"/>
  </g>
  <!-- node: thermostat -->
  <g transform="translate(564 354)">
    <circle cx="32" cy="32" r="30" fill="#0C0D0F" stroke="url(#gold)" stroke-width="2.2"/>
    <circle cx="32" cy="32" r="19" fill="none" stroke="#C5C8CC" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M32 13a19 19 0 0116 29" fill="none" stroke="#D7AE55" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="4.5" fill="#F1D58A"/>
  </g>
  <!-- phone remote -->
  <g transform="translate(452 170)">
    <rect x="0" y="0" width="76" height="146" rx="16" fill="#0A0B0C" stroke="url(#steel)" stroke-width="2.5"/>
    <rect x="7" y="7" width="62" height="132" rx="11" fill="url(#screen)"/>
    <rect x="17" y="20" width="42" height="5" rx="2.5" fill="#D7AE55" opacity="0.8"/>
    <g fill="#C5C8CC" opacity="0.16">
      <rect x="17" y="36" width="18" height="18" rx="5"/><rect x="41" y="36" width="18" height="18" rx="5"/>
      <rect x="17" y="60" width="18" height="18" rx="5"/><rect x="41" y="60" width="18" height="18" rx="5"/>
    </g>
    <rect x="17" y="36" width="18" height="18" rx="5" fill="#D7AE55" opacity="0.6"/>
    <rect x="17" y="90" width="42" height="26" rx="8" fill="#D7AE55" opacity="0.2" stroke="#D7AE55" stroke-opacity="0.5"/>
    <circle cx="48" cy="103" r="7" fill="#F1D58A" opacity="0.8"/>
  </g>
  <rect width="800" height="560" fill="url(#vign)"/>
</svg>
