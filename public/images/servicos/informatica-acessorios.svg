    <g fill="#C5C8CC" opacity="0.16"><rect x="16" y="14" width="19" height="16" rx="3.5"/><rect x="41" y="14" width="19" height="16" rx="3.5"/><rect x="66" y="14" width="19" height="16" rx="3.5"/><rect x="91" y="14" width="19" height="16" rx="3.5"/><rect x="116" y="14" width="19" height="16" rx="3.5"/><rect x="141" y="14" width="19" height="16" rx="3.5"/><rect x="166" y="14" width="19" height="16" rx="3.5"/><rect x="191" y="14" width="19" height="16" rx="3.5"/><rect x="216" y="14" width="19" height="16" rx="3.5"/><rect x="241" y="14" width="19" height="16" rx="3.5"/><rect x="266" y="14" width="19" height="16" rx="3.5"/><rect x="291" y="14" width="19" height="16" rx="3.5"/><rect x="16" y="36" width="19" height="16" rx="3.5"/><rect x="41" y="36" width="19" height="16" rx="3.5"/><rect x="66" y="36" width="19" height="16" rx="3.5"/><rect x="91" y="36" width="19" height="16" rx="3.5"/><rect x="116" y="36" width="19" height="16" rx="3.5"/><rect x="141" y="36" width="19" height="16" rx="3.5"/><rect x="166" y="36" width="19" height="16" rx="3.5"/><rect x="191" y="36" width="19" height="16" rx="3.5"/><rect x="216" y="36" width="19" height="16" rx="3.5"/><rect x="241" y="36" width="19" height="16" rx="3.5"/><rect x="266" y="36" width="19" height="16" rx="3.5"/><rect x="291" y="36" width="19" height="16" rx="3.5"/><rect x="16" y="58" width="19" height="16" rx="3.5"/><rect x="41" y="58" width="19" height="16" rx="3.5"/><rect x="66" y="58" width="19" height="16" rx="3.5"/><rect x="91" y="58" width="19" height="16" rx="3.5"/><rect x="116" y="58" width="19" height="16" rx="3.5"/><rect x="141" y="58" width="19" height="16" rx="3.5"/><rect x="166" y="58" width="19" height="16" rx="3.5"/><rect x="191" y="58" width="19" height="16" rx="3.5"/><rect x="216" y="58" width="19" height="16" rx="3.5"/><rect x="241" y="58" width="19" height="16" rx="3.5"/><rect x="266" y="58" width="19" height="16" rx="3.5"/><rect x="291" y="58" width="19" height="16" rx="3.5"/></g>
    <rect x="16" y="80" width="298" height="0" /></g>
  <g transform="translate(208 334) skewX(-10)" fill="#D7AE55" opacity="0.5">
    <rect x="16" y="14" width="19" height="16" rx="3.5"/>
    <rect x="291" y="58" width="19" height="16" rx="3.5"/>
  </g>
  <!-- mouse -->
  <g transform="translate(584 346)">
    <path d="M34 0c19 0 34 16 34 36v30c0 20-15 36-34 36S0 86 0 66V36C0 16 15 0 34 0z" fill="url(#steelSoft)" stroke="#C5C8CC" stroke-opacity="0.3" stroke-width="2"/>
