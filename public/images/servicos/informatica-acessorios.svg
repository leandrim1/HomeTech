    <rect x="0" y="0" width="330" height="208" rx="14" fill="#0A0B0C" stroke="url(#steel)" stroke-width="2.5"/>
    <rect x="11" y="11" width="308" height="174" rx="7" fill="url(#screen)"/>
    <!-- dashboard UI -->
    <g>
      <rect x="24" y="24" width="120" height="10" rx="5" fill="#D7AE55" opacity="0.75"/>
      <rect x="24" y="46" width="76" height="7" rx="3.5" fill="#C5C8CC" opacity="0.3"/>
      <rect x="24" y="72" width="134" height="96" rx="8" fill="#C5C8CC" opacity="0.07" stroke="#C5C8CC" stroke-opacity="0.12"/>
      <path d="M36 150l24-30 26 18 28-44 30 22" fill="none" stroke="#D7AE55" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#C5C8CC" opacity="0.1">
        <rect x="172" y="72" width="134" height="28" rx="6"/>
        <rect x="172" y="106" width="134" height="28" rx="6"/>
        <rect x="172" y="140" width="92" height="28" rx="6"/>
      </g>
      <rect x="172" y="72" width="5" height="28" rx="2.5" fill="#D7AE55" opacity="0.8"/>
      <rect x="172" y="106" width="5" height="28" rx="2.5" fill="#C5C8CC" opacity="0.4"/>
      <rect x="172" y="140" width="5" height="28" rx="2.5" fill="#C5C8CC" opacity="0.25"/>
    </g>
    <rect x="138" y="208" width="54" height="40" fill="url(#steelSoft)"/>
    <rect x="96" y="246" width="138" height="12" rx="6" fill="url(#steel)" opacity="0.75"/>
  </g>
