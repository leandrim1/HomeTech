<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Ilustração de propriedade rural com torre de conectividade, sensor de campo e tablet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#17181C"/>
      <stop offset="0.5" stop-color="#0B0C0E"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="key" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#D7AE55" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#D7AE55" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#D7AE55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.18" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#C5C8CC" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C5C8CC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#9BA0A6"/>
      <stop offset="0.35" stop-color="#E4E7EA"/>
      <stop offset="0.62" stop-color="#8C9197"/>
      <stop offset="1" stop-color="#5A5F65"/>
    </linearGradient>
    <linearGradient id="steelSoft" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3A3D42"/>
      <stop offset="0.5" stop-color="#23262A"/>
      <stop offset="1" stop-color="#15171A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8E6B24"/>
      <stop offset="0.32" stop-color="#F1D58A"/>
      <stop offset="0.6" stop-color="#D7AE55"/>
      <stop offset="1" stop-color="#8E6B24"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1D2026"/>
      <stop offset="0.5" stop-color="#0D0F12"/>
      <stop offset="1" stop-color="#070809"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7AE55" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D7AE55" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#C5C8CC" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="vign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050505" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#050505" stop-opacity="0"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/>
  <rect width="800" height="560" fill="url(#grid)"/>
  <rect width="800" height="560" fill="url(#rim)"/>
  <rect width="800" height="560" fill="url(#key)"/>

  <!-- horizon -->
  <path d="M0 330c120-26 210 14 320-6s220-44 340-20 140 26 140 26v230H0z" fill="#0A0B0C"/>
  <path d="M0 330c120-26 210 14 320-6s220-44 340-20 140 26 140 26" fill="none" stroke="#D7AE55" stroke-opacity="0.3" stroke-width="1.6"/>
  <path d="M0 384c140-22 236 16 352-4s216-34 332-14 116 20 116 20v174H0z" fill="#070708"/>
  <!-- furrow lines -->
  <g stroke="#C5C8CC" stroke-opacity="0.08" stroke-width="1.5">
    <path d="M-40 560L288 404M110 560L348 404M268 560L408 404M430 560L470 404M592 560L532 404M750 560L594 404"/>
  </g>
  <!-- barn / silo -->
  <g transform="translate(96 244)">
    <path d="M0 52L72 8l72 44v110H0z" fill="url(#steelSoft)" stroke="#C5C8CC" stroke-opacity="0.3" stroke-width="2" stroke-linejoin="round"/>
    <rect x="54" y="104" width="36" height="58" rx="3" fill="#D7AE55" opacity="0.2" stroke="#D7AE55" stroke-opacity="0.45"/>
    <path d="M0 52L72 8v154H0z" fill="#000" opacity="0.22"/>
    <g transform="translate(160 32)">
      <path d="M0 22a26 26 0 0152 0v108H0z" fill="url(#steelSoft)" stroke="#C5C8CC" stroke-opacity="0.28" stroke-width="2"/>
      <path d="M0 56h52M0 86h52M0 116h52" stroke="#C5C8CC" stroke-opacity="0.12" stroke-width="1.6"/>
    </g>
  </g>
  <!-- connectivity tower -->
  <g transform="translate(486 76)">
    <path d="M60 36L96 300H24z" fill="none" stroke="url(#steel)" stroke-width="3.5" stroke-linejoin="round"/>
    <g stroke="url(#steel)" stroke-width="2" opacity="0.65">
      <path d="M37 136h46M33 180h54M28 224h64M46 92h28"/>
      <path d="M37 136l46 44M83 136l-46 44M33 180l54 44M87 180l-54 44"/>
    </g>
    <!-- antenna head -->
    <rect x="48" y="8" width="24" height="34" rx="7" fill="url(#steelSoft)" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="60" cy="25" r="5" fill="#D7AE55"/>
    <!-- dishes -->
    <ellipse cx="22" cy="118" rx="16" ry="20" fill="#0D0E10" stroke="url(#steel)" stroke-width="2" transform="rotate(-24 22 118)"/>
    <ellipse cx="98" cy="118" rx="16" ry="20" fill="#0D0E10" stroke="url(#steel)" stroke-width="2" transform="rotate(24 98 118)"/>
  </g>
  <!-- signal waves -->
  <g fill="none" stroke="#D7AE55" stroke-linecap="round">
    <path d="M568 56a46 46 0 0152 0" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M550 32a78 78 0 0188 0" stroke-opacity="0.34" stroke-width="3"/>
    <path d="M532 8a110 110 0 01124 0" stroke-opacity="0.18" stroke-width="3"/>
  </g>
  <!-- field sensor node -->
  <g transform="translate(336 348)">
    <rect x="16" y="0" width="6" height="64" rx="3" fill="url(#steel)" opacity="0.8"/>
    <rect x="0" y="-34" width="38" height="36" rx="7" fill="#0C0D0F" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="19" cy="-16" r="6" fill="#D7AE55" opacity="0.85"/>
    <g stroke="#D7AE55" stroke-opacity="0.4" stroke-width="2" fill="none">
      <path d="M44 -26a20 20 0 010 22"/><path d="M54 -34a34 34 0 010 38"/>
    </g>
  </g>
  <!-- tablet in the field -->
  <g transform="translate(596 326) rotate(-8)">
    <rect x="0" y="0" width="128" height="92" rx="12" fill="#0A0B0C" stroke="url(#steel)" stroke-width="2.5"/>
    <rect x="8" y="8" width="112" height="76" rx="7" fill="url(#screen)"/>
    <path d="M20 68l22-22 20 14 24-30 22 16" fill="none" stroke="#D7AE55" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20" y="20" width="40" height="6" rx="3" fill="#C5C8CC" opacity="0.3"/>
  </g>
  <g stroke="#D7AE55" stroke-opacity="0.3" fill="none" stroke-width="1.4" transform="translate(28 118) scale(1 1)">
    <path d="M0 0h46l18 18h52"/>
    <path d="M0 26h30l16-16h40"/>
    <path d="M0 52h58l14 14h38"/>
    <circle cx="116" cy="18" r="3" fill="#D7AE55" stroke="none"/>
    <circle cx="86" cy="10" r="3" fill="#D7AE55" stroke="none"/>
    <circle cx="124" cy="66" r="3" fill="#D7AE55" stroke="none"/>
  </g>

  <rect width="800" height="560" fill="url(#vign)"/>
</svg>
